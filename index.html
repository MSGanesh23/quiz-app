<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mastery Quiz - 100% Accuracy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --secondary: #06b6d4;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --success: #22c55e;
            --error: #ef4444;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        #app {
            width: 100%;
            max-width: 800px;
            position: relative;
        }

        /* Glassmorphism Card */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #818cf8, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-dim);
            margin-bottom: 2.5rem;
            font-size: 1.1rem;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            width: 0%;
            transition: width 0.5s ease;
        }

        /* Question Section */
        .question-text {
            font-size: 1.4rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 2rem;
        }

        .options-grid {
            display: grid;
            gap: 12px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            font-size: 1.05rem;
            color: var(--text);
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }

        .option-btn.selected {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--primary);
        }

        .option-btn.correct {
            background: rgba(34, 197, 94, 0.15) !important;
            border-color: var(--success) !important;
        }

        .option-btn.wrong {
            background: rgba(239, 68, 68, 0.15) !important;
            border-color: var(--error) !important;
        }

        .option-label {
            font-weight: 700;
            margin-right: 15px;
            color: var(--secondary);
            text-transform: uppercase;
        }

        /* Controls */
        .controls {
            margin-top: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.39);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.23);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
        }

        /* Accuracy Helpers */
        .helper-tools {
            position: absolute;
            top: -60px;
            right: 0;
            display: flex;
            gap: 15px;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .4s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--secondary);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* Result Screen */
        .result-screen {
            text-align: center;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 8px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 700;
            margin: 0 auto 2rem;
            position: relative;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 2rem;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 12px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            display: block;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.4s ease forwards;
        }

        .hidden {
            display: none !important;
        }

        .correct-indicator {
            position: absolute;
            right: 20px;
            color: var(--success);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- Helper Tools -->
        <div class="helper-tools">
            <div class="toggle-container">
                <span>Cheat Mode</span>
                <label class="switch">
                    <input type="checkbox" id="cheat-toggle">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="toggle-container">
                <span>Auto-Progress</span>
                <label class="switch">
                    <input type="checkbox" id="auto-toggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="card fade-in">
            <h1>Mastery Quiz</h1>
            <p class="subtitle">Score 100% accuracy with these pharmaceutical GMP questions.</p>
            <div style="text-align: center;">
                <button class="btn btn-primary" onclick="quiz.start()">Start Learning</button>
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="card fade-in hidden">
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div id="question-count" style="font-size: 0.9rem; color: var(--text-dim); margin-bottom: 10px;">Question 1 of 164</div>
            <div class="question-text" id="question-text">Question content goes here...</div>
            
            <div class="options-grid" id="options-grid">
                <!-- Options will be injected here -->
            </div>

            <div class="controls">
                <button class="btn btn-outline" id="prev-btn" onclick="quiz.prev()" disabled>Previous</button>
                <div id="feedback-msg" style="font-weight: 600;"></div>
                <button class="btn btn-primary" id="next-btn" onclick="quiz.next()" disabled>Next Question</button>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="card fade-in hidden">
            <h1>Quiz Complete!</h1>
            <div class="score-circle" id="final-score">0%</div>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-value" id="total-qs">0</span>
                    <span class="stat-label">Questions</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="correct-qs" style="color: var(--success)">0</span>
                    <span class="stat-label">Correct</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="wrong-qs" style="color: var(--error)">0</span>
                    <span class="stat-label">Incorrect</span>
                </div>
            </div>
            <div style="text-align: center; display: flex; gap:10px; justify-content: center;">
                <button class="btn btn-primary" onclick="quiz.restart()">Try Again</button>
                <button class="btn btn-outline" onclick="quiz.reviewMissed()">Review Missed</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        class Quiz {
            constructor() {
                this.questions = [];
                this.currentIndex = 0;
                this.score = 0;
                this.userAnswers = [];
                this.missedIndices = [];

                this.dom = {
                    start: document.getElementById('start-screen'),
                    quiz: document.getElementById('quiz-screen'),
                    result: document.getElementById('result-screen'),
                    questionText: document.getElementById('question-text'),
                    optionsGrid: document.getElementById('options-grid'),
                    progressBar: document.getElementById('progress-bar'),
                    currentCount: document.getElementById('question-count'),
                    nextBtn: document.getElementById('next-btn'),
                    prevBtn: document.getElementById('prev-btn'),
                    finalScore: document.getElementById('final-score'),
                    totalQs: document.getElementById('total-qs'),
                    correctQs: document.getElementById('correct-qs'),
                    wrongQs: document.getElementById('wrong-qs'),
                    feedback: document.getElementById('feedback-msg'),
                    cheatToggle: document.getElementById('cheat-toggle'),
                    autoToggle: document.getElementById('auto-toggle')
                };

                // Load settings from local storage
                this.dom.cheatToggle.checked = localStorage.getItem('cheatMode') === 'true';
                this.dom.autoToggle.checked = localStorage.getItem('autoMode') !== 'false';
                
                this.dom.cheatToggle.onchange = () => {
                    localStorage.setItem('cheatMode', this.dom.cheatToggle.checked);
                    this.renderQuestion();
                };
                this.dom.autoToggle.onchange = () => localStorage.setItem('autoMode', this.dom.autoToggle.checked);
            }

            async load() {
                try {
                    const response = await fetch('questions.json');
                    this.questions = await response.json();
                    
                    // Restore progress if exists
                    const savedIndex = localStorage.getItem('currentIndex');
                    const savedAnswers = localStorage.getItem('userAnswers');
                    if (savedIndex && savedAnswers) {
                        this.currentIndex = parseInt(savedIndex);
                        this.userAnswers = JSON.parse(savedAnswers);
                        if (this.userAnswers.length !== this.questions.length) {
                             this.userAnswers = new Array(this.questions.length).fill(null);
                        }
                    } else {
                        this.userAnswers = new Array(this.questions.length).fill(null);
                    }
                } catch (e) {
                    console.error("Failed to load questions:", e);
                }
            }

            start() {
                this.showScreen('quiz');
                this.renderQuestion();
            }

            restart() {
                localStorage.removeItem('currentIndex');
                localStorage.removeItem('userAnswers');
                this.currentIndex = 0;
                this.userAnswers = new Array(this.questions.length).fill(null);
                this.score = 0;
                this.showScreen('quiz');
                this.renderQuestion();
            }

            reviewMissed() {
                if (this.missedIndices.length === 0) {
                    alert("Zero mistakes! You are a master.");
                    return;
                }
                // Filter questions to only missed ones
                const missed = this.missedIndices.map(i => this.questions[i]);
                this.questions = missed;
                this.restart();
            }

            showScreen(screen) {
                this.dom.start.classList.add('hidden');
                this.dom.quiz.classList.add('hidden');
                this.dom.result.classList.add('hidden');
                this.dom[screen].classList.remove('hidden');
            }

            renderQuestion() {
                const q = this.questions[this.currentIndex];
                this.dom.questionText.innerText = q.question;
                this.dom.currentCount.innerText = `Question ${this.currentIndex + 1} of ${this.questions.length}`;
                this.dom.progressBar.style.width = `${((this.currentIndex + 1) / this.questions.length) * 100}%`;
                
                this.dom.optionsGrid.innerHTML = '';
                this.dom.feedback.innerText = '';
                this.dom.nextBtn.disabled = this.userAnswers[this.currentIndex] === null;
                this.dom.prevBtn.disabled = this.currentIndex === 0;

                const isAnswered = this.userAnswers[this.currentIndex] !== null;
                const cheatMode = this.dom.cheatToggle.checked;

                q.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerHTML = `<span class="option-label">${opt.label}</span> <span>${opt.text}</span>`;
                    
                    if (cheatMode && opt.text === q.answer) {
                        btn.style.borderColor = 'rgba(34, 197, 94, 0.4)';
                        btn.style.background = 'rgba(34, 197, 94, 0.05)';
                    }

                    if (isAnswered) {
                        const chosenIdx = this.userAnswers[this.currentIndex];
                        if (opt.text === q.answer) {
                            btn.classList.add('correct');
                        } else if (idx === chosenIdx) {
                            btn.classList.add('wrong');
                        }
                        btn.disabled = true;
                    } else {
                        btn.onclick = () => this.handleAnswer(idx, opt.text);
                    }
                    
                    this.dom.optionsGrid.appendChild(btn);
                });

                // Save progress
                localStorage.setItem('currentIndex', this.currentIndex);
                localStorage.setItem('userAnswers', JSON.stringify(this.userAnswers));
            }

            handleAnswer(idx, text) {
                const q = this.questions[this.currentIndex];
                this.userAnswers[this.currentIndex] = idx;
                
                this.renderQuestion();

                if (this.dom.autoToggle.checked) {
                    setTimeout(() => {
                        this.next();
                    }, 600);
                }
            }

            next() {
                if (this.currentIndex < this.questions.length - 1) {
                    this.currentIndex++;
                    this.renderQuestion();
                } else {
                    this.finish();
                }
            }

            prev() {
                if (this.currentIndex > 0) {
                    this.currentIndex--;
                    this.renderQuestion();
                }
            }

            finish() {
                this.score = 0;
                this.missedIndices = [];
                
                this.userAnswers.forEach((ansIdx, i) => {
                    if (ansIdx !== null) {
                        const optText = this.questions[i].options[ansIdx].text;
                        if (optText === this.questions[i].answer) {
                            this.score++;
                        } else {
                            this.missedIndices.push(i);
                        }
                    } else {
                        this.missedIndices.push(i);
                    }
                });

                this.showScreen('result');
                const percent = Math.round((this.score / this.questions.length) * 100);
                this.dom.finalScore.innerText = `${percent}%`;
                this.dom.totalQs.innerText = this.questions.length;
                this.dom.correctQs.innerText = this.score;
                this.dom.wrongQs.innerText = this.questions.length - this.score;

                if (percent === 100) {
                    confetti({
                        particleCount: 150,
                        spread: 70,
                        origin: { y: 0.6 },
                        colors: ['#6366f1', '#06b6d4', '#22c55e']
                    });
                }
            }
        }

        const quiz = new Quiz();
        window.onload = () => quiz.load();
    </script>

</body>
</html>
